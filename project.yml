# XcodeGen spec. Generate the Xcode project with `make project` (or just `make`).
#
# Signing: DEVELOPMENT_TEAM is passed in by scripts/build.sh, which detects it from your
# "Apple Development" certificate (override with TEAM=XXXXXXXXXX). BUNDLE_ID_PREFIX can be
# overridden the same way (BUNDLE_ID_PREFIX=com.example) if you ship your own fork.
name: KubeWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    BUNDLE_ID_PREFIX: com.austinkurpuis
    # Team-prefixed App Groups work on macOS without a provisioning profile.
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).group.$(BUNDLE_ID_PREFIX).kubewidget
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # no get-task-allow in release builds

targets:
  KubeWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kubewidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KubeWidget
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Austin Kurpuis. MIT License.
        NSLocalNetworkUsageDescription: KubeWidget runs kubectl and checks SSH hosts on your local network.
        KWAppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [kubewidget]
    entitlements:
      path: App/KubeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: KubeWidgetExtension

  KubeWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kubewidget.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: KubeWidget
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        KWAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/KubeWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
